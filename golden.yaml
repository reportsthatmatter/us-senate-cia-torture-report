# Golden pages: ground truth for this report, read off the PDF page image and checked by `pnpm ingest verify`.
# Format and rules: @rtm/ingest src/golden.ts and the site's docs/quality-harness.md ("Golden pages").
# A page marked xfail is a known pipeline defect: it stays red here, verify stays green, and the bead says why.
# The source is a scan with an OCR layer. A redaction box is served as "[Redacted]" (redactions.ts), so these
# entries write it that way; classification banners, portion markings and "Page N of 499" never reach the text.
pages:
  # The Executive Summary's part II opens: three outline headings over two and three lines each, one ending on a
  # box, then paragraphs with page notes. Marker 8 is printed raised but the OCR read it as "K"; and the third
  # paragraph runs on after a box that opens a line ("[Redacted] sent an email describing"), which the pipeline
  # took for a new paragraph.
  - pdf: 40
    printed: 11
    verified_by: "Claude (Opus 5.5), 2026-10-10, against the page image"
    xfail: reportsthatmatter-jc46
    xfail_only: [blocks, markers]
    blocks:
      - heading: "II. Overall History and Operation of the CIA's Detention and Interrogation Program"
        level: 2
      - heading: "A. September 17, 2001, Memorandum of Notification (MON) Authorizes the CIA to Capture and Detain a Specific Category of Individuals"
        level: 3
      - heading: "1. After Considering Various Clandestine Detention Locations, the CIA Determines That a U.S. Military Base Is the \"Best Option\"; the CIA Delegates \"Blanket\" Detention Approvals to CIA Officers in [Redacted]"
        level: 4
      - paragraph: {start: "On September 17, 2001, six days", end: "to interrogations or interrogation techniques.", notes: [7, 8, 9]}
      - paragraph: {start: "On September 14, 2001, three days", end: "least three proposed site locations.", notes: [10, 11]}
      - paragraph: {start: "On September 26, 2001, senior CTC", continues: true}
    footnotes: [7, 8, 9, 10, 11]
    markers: [7, 8, 9, 10, 11]
    must_not_contain: ["Page 11 of 499", "NOFORN", "UNCLASSIFIED"]
  # A body page dense with redactions: four portion-marked paragraphs ("(TS//[box]//NF)", struck through), boxes
